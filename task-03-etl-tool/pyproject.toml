[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-tool"
version = "1.0.0"
description = "Small ETL tool with a rule engine, failure recovery, and a run monitor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0"]

[project.scripts]
etl-tool = "etl_tool.cli:main"

[tool.setuptools.packages.find]
include = ["etl_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["etl_tool/transform"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
