name: task-04 scheduler simulator

on:
  pull_request:
    paths:
      - 'task-04-scheduler-simulator/**'
      - '.github/workflows/task-04-scheduler-simulator.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-04-scheduler-simulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: task-04-scheduler-simulator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts for screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-playwright-report
          if-no-files-found: warn
          path: |
            task-04-scheduler-simulator/playwright-report/
            task-04-scheduler-simulator/screenshots/
            task-04-scheduler-simulator/test-results/
